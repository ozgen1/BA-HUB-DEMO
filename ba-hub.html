<title>BA Hub</title>
<style>
  :root{
    --bg:#f9f9f7; --surface:#fcfcfb; --surface-2:#f2f1ec; --surface-hover:#eeece5;
    --text:#0b0b0b; --text-2:#52514e; --muted:#898781;
    --border:rgba(11,11,11,.10); --border-strong:rgba(11,11,11,.16);
    --accent:#2a78d6; --accent-ink:#ffffff; --accent-wash:#e8f0fb;
    --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100; --series-5:#e87ba4; --series-6:#4a3aa7;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --grid:#e1e0d9; --axis:#c3c2b7;
    --shadow:0 1px 2px rgba(11,11,11,.05),0 8px 24px -12px rgba(11,11,11,.18);
    --radius-s:6px; --radius-m:10px; --radius-l:16px;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#202020; --surface-hover:#262625;
      --text:#ffffff; --text-2:#c3c2b7; --muted:#898781;
      --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.18);
      --accent:#3987e5; --accent-ink:#ffffff; --accent-wash:#152a41;
      --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181; --series-6:#9085e9;
      --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
      --grid:#2c2c2a; --axis:#383835;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#202020; --surface-hover:#262625;
    --text:#ffffff; --text-2:#c3c2b7; --muted:#898781;
    --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.18);
    --accent:#3987e5; --accent-ink:#ffffff; --accent-wash:#152a41;
    --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181; --series-6:#9085e9;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --grid:#2c2c2a; --axis:#383835;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
    color-scheme:dark;
  }

  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap');

  *,*::before,*::after{box-sizing:border-box}
  body{
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.font-display{font-family:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif}
  .tnum{font-variant-numeric:tabular-nums}
  a{color:inherit}
  button{font:inherit}
  ::selection{background:var(--accent);color:var(--accent-ink)}

  /* ---------- layout shell ---------- */
  .app{display:flex;min-height:100dvh;width:100%}
  .sidebar{
    width:252px;flex:0 0 252px;background:var(--surface);border-right:1px solid var(--border);
    display:flex;flex-direction:column;gap:4px;padding:16px 12px;position:sticky;top:0;
    height:100dvh;overflow-y:auto;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;background:linear-gradient(155deg,var(--accent),var(--series-6));
    display:flex;align-items:center;justify-content:center;color:#fff;font-family:"Outfit";font-weight:700;font-size:14px;flex:none;
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.15}
  .brand-text b{font-family:"Outfit";font-weight:700;font-size:15px;letter-spacing:.01em}
  .brand-text span{font-size:11px;color:var(--muted)}

  .nav-group{display:flex;flex-direction:column;gap:1px;margin-bottom:10px}
  .nav-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 10px 4px}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-s);
    font-size:13.5px;color:var(--text-2);cursor:pointer;border:none;background:none;text-align:left;width:100%;
  }
  .nav-item:hover{background:var(--surface-hover);color:var(--text)}
  .nav-item.active{background:var(--accent-wash);color:var(--accent);font-weight:600}
  .nav-item .ico{width:16px;height:16px;flex:none;opacity:.85}
  .nav-sub{display:flex;flex-direction:column;gap:1px;margin-left:14px;padding-left:10px;border-left:1px solid var(--border);margin-bottom:6px}
  .nav-sub .nav-item{font-size:12.5px;padding:6px 10px}
  .nav-chevron{margin-left:auto;font-size:10px;opacity:.6;transition:transform .15s}
  .nav-chevron.open{transform:rotate(90deg)}

  .sidebar-foot{margin-top:auto;padding:10px 8px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
  .db-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--good)}
  .db-dot.off{background:var(--muted)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    position:sticky;top:0;z-index:5;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:14px;min-height:60px;
  }
  .hamburger{display:none;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-s);width:34px;height:34px;align-items:center;justify-content:center;cursor:pointer;flex:none}
  .topbar-title{font-family:"Outfit";font-weight:600;font-size:19px}
  .topbar-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
  .topbar-actions{margin-left:auto;display:flex;align-items:center;gap:10px}

  .content{padding:24px 28px 64px;flex:1}
  .content-inner{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

  /* ---------- primitives ---------- */
  .select, .input, textarea.input{
    border:1px solid var(--border-strong);background:var(--surface);color:var(--text);border-radius:var(--radius-s);
    padding:7px 10px;font-size:13px;font-family:inherit;
  }
  select.select{padding-right:26px}
  .input:focus, .select:focus, textarea.input:focus{outline:2px solid var(--accent);outline-offset:1px}
  label.field-label{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:5px;display:block}
  .field{display:flex;flex-direction:column;margin-bottom:12px}
  .field-row{display:flex;gap:12px;flex-wrap:wrap}
  .field-row .field{flex:1;min-width:160px}
  .hint{font-size:11.5px;color:var(--muted);margin-top:4px}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--radius-s);
    padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;white-space:nowrap;
  }
  .btn-primary{background:var(--accent);color:var(--accent-ink)}
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-ghost{background:transparent;border-color:var(--border-strong);color:var(--text)}
  .btn-ghost:hover{background:var(--surface-hover)}
  .btn-danger{background:transparent;border-color:var(--critical);color:var(--critical)}
  .btn-danger:hover{background:color-mix(in srgb, var(--critical) 12%, transparent)}
  .btn-sm{padding:5px 10px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .icon-btn{border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--radius-s);width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2)}
  .icon-btn:hover{background:var(--surface-hover);color:var(--text)}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);padding:18px 20px}
  .card-title{font-family:"Outfit";font-weight:600;font-size:15px;margin-bottom:2px}
  .card-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}

  .grid-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
  .grid-2b{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:980px){.grid-kpi{grid-template-columns:repeat(2,1fr)}.grid-2,.grid-2b{grid-template-columns:1fr}}

  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
  .kpi-label{font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:space-between}
  .kpi-value{font-size:28px;font-weight:700;line-height:1}
  .kpi-delta{font-size:11.5px;color:var(--text-2)}
  .kpi-delta.good{color:var(--good)}
  .kpi-delta.critical{color:var(--critical)}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
  .badge .dot{width:6px;height:6px;border-radius:50%;flex:none;background:currentColor}
  .badge-neutral{background:var(--surface-2);color:var(--text-2);border-color:var(--border)}
  .badge-accent{background:var(--accent-wash);color:var(--accent)}
  .badge-good{background:color-mix(in srgb, var(--good) 14%, transparent);color:var(--good)}
  .badge-warning{background:color-mix(in srgb, var(--warning) 20%, transparent);color:#8a5a00}
  .badge-serious{background:color-mix(in srgb, var(--serious) 18%, transparent);color:#a1391a}
  .badge-critical{background:color-mix(in srgb, var(--critical) 14%, transparent);color:var(--critical)}
  .badge-priority-high{background:color-mix(in srgb, var(--critical) 14%, transparent);color:var(--critical)}
  .badge-priority-medium{background:color-mix(in srgb, var(--warning) 20%, transparent);color:#8a5a00}
  .badge-priority-low{background:var(--surface-2);color:var(--text-2)}
  /* warning/serious/priority-medium text uses a manually-darkened shade in light
     mode for AA-ish contrast (the raw status hues are too light on a light
     surface per spec); in dark mode the token itself already contrasts, so the
     dark overrides below restore it. */
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .badge-warning,
    :root:not([data-theme="light"]) .badge-priority-medium{color:var(--warning)}
    :root:not([data-theme="light"]) .badge-serious{color:var(--serious)}
  }
  :root[data-theme="dark"] .badge-warning, :root[data-theme="dark"] .badge-priority-medium{color:var(--warning)}
  :root[data-theme="dark"] .badge-serious{color:var(--serious)}

  table.tbl{width:100%;border-collapse:collapse;font-size:13px}
  table.tbl th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
    font-weight:600;padding:0 12px 8px;border-bottom:1px solid var(--border);white-space:nowrap;
  }
  table.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
  table.tbl tbody tr:hover{background:var(--surface-hover)}
  table.tbl tbody tr:last-child td{border-bottom:none}
  .tbl-wrap{overflow-x:auto;margin:0 -2px}
  .cell-muted{color:var(--muted)}
  .cell-strong{font-weight:600}
  .row-actions{display:flex;gap:6px;justify-content:flex-end}
  .empty-state{padding:36px 20px;text-align:center;color:var(--muted);font-size:13px}

  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .toolbar .spacer{flex:1}
  .chip{border:1px solid var(--border-strong);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--text-2)}
  .chip:hover{background:var(--surface-hover)}
  .chip.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
  .tab{padding:9px 4px;margin-right:18px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--accent);border-color:var(--accent)}

  /* bar chart */
  .barchart{display:flex;flex-direction:column;gap:10px}
  .barchart .row{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center;font-size:12.5px}
  .barchart .row .lbl{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .barchart .track{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;position:relative}
  .barchart .fill{height:100%;border-radius:999px}
  .barchart .val{text-align:right;font-weight:600}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2);margin-top:4px}
  .legend .item{display:flex;align-items:center;gap:6px}
  .legend .sw{width:9px;height:9px;border-radius:3px;flex:none}

  .ring-wrap{display:flex;align-items:center;gap:16px}
  .ring{
    width:96px;height:96px;border-radius:50%;flex:none;position:relative;
    display:flex;align-items:center;justify-content:center;
  }
  .ring::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--surface)}
  .ring b{position:relative;font-size:19px;font-weight:700}

  /* process flow */
  .flow{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 0}
  .flow-node{
    border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--radius-m);
    padding:10px 16px;font-size:12.5px;text-align:center;max-width:260px;box-shadow:var(--shadow);
  }
  .flow-node.start,.flow-node.end{border-radius:999px;background:var(--accent-wash);border-color:var(--accent);color:var(--accent);font-weight:600}
  .flow-node.decision{background:var(--surface-2);border-style:dashed;font-weight:600}
  .flow-connector{width:2px;height:22px;background:var(--axis)}
  .flow-connector.arrow{position:relative}
  .flow-connector.arrow::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--axis)}
  .flow-branch-wrap{display:flex;gap:28px;align-items:flex-start;width:100%;justify-content:center}
  .flow-branch{display:flex;flex-direction:column;align-items:center;flex:1;max-width:300px}
  .flow-branch-label{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}

  /* sql console */
  .sql-editor{width:100%;min-height:110px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;resize:vertical}
  .sql-result-meta{font-size:12px;color:var(--muted);display:flex;gap:14px;margin:10px 0}
  .sql-error{background:color-mix(in srgb, var(--critical) 10%, transparent);border:1px solid var(--critical);color:var(--critical);border-radius:var(--radius-s);padding:10px 12px;font-size:12.5px;font-family:ui-monospace,monospace}
  .schema-list{display:flex;flex-direction:column;gap:10px}
  .schema-table{border:1px solid var(--border);border-radius:var(--radius-s);overflow:hidden}
  .schema-table-head{background:var(--surface-2);padding:7px 10px;font-size:12.5px;font-weight:700;font-family:ui-monospace,monospace}
  .schema-cols{padding:8px 10px;display:flex;flex-wrap:wrap;gap:5px}
  .schema-col{font-size:11px;font-family:ui-monospace,monospace;background:var(--surface-2);padding:2px 7px;border-radius:5px;color:var(--text-2)}

  /* modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(11,11,11,.42);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:5vh 16px;overflow-y:auto}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);width:100%;max-width:560px;box-shadow:var(--shadow);margin-bottom:5vh}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}
  .modal-title{font-family:"Outfit";font-weight:600;font-size:16px}
  .modal-body{padding:18px 20px;max-height:65vh;overflow-y:auto}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

  /* toast */
  .toast-stack{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:80}
  .toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:var(--radius-s);font-size:13px;box-shadow:var(--shadow);max-width:320px}
  .toast.error{background:var(--critical);color:#fff}

  .link-btn{background:none;border:none;color:var(--accent);font-weight:600;font-size:12.5px;cursor:pointer;padding:0}
  .divider{height:1px;background:var(--border);margin:4px 0}
  .muted{color:var(--muted)}
  .mb-0{margin-bottom:0}
  .flex{display:flex}
  .items-center{align-items:center}
  .gap-8{gap:8px}
  .w-full{width:100%}
  code.inline{font-family:ui-monospace,monospace;background:var(--surface-2);padding:1px 5px;border-radius:4px;font-size:12px}

  @media (max-width:860px){
    .sidebar{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:transform .18s ease;box-shadow:var(--shadow)}
    body.nav-open .sidebar{transform:translateX(0)}
    body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30}
    .hamburger{display:inline-flex}
    .content{padding:18px 16px 48px}
    .topbar{padding:12px 16px}
    .grid-kpi{grid-template-columns:1fr 1fr}
  }
  @media (max-width:480px){
    .grid-kpi{grid-template-columns:1fr}
    .modal{max-width:100%}
  }
</style>
<div class="app">
  <aside class="sidebar" id="sidebar"><!--NAV--></aside>
  <div class="main">
    <div class="topbar">
      <button class="hamburger" id="hamburgerBtn" aria-label="Menüyü aç">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <div>
        <div class="topbar-title" id="topbarTitle">Dashboard</div>
        <div class="topbar-sub" id="topbarSub"></div>
      </div>
      <div class="topbar-actions" id="topbarActions"></div>
    </div>
    <div class="content"><div class="content-inner" id="mainContent"><!--MAIN--></div></div>
  </div>
</div>
<div id="modalRoot"></div>
<div class="toast-stack" id="toastStack"></div>
<script>// MiniSQL — a small, dependency-free SQL subset engine for BA HUB's SQL/Data console.
// Supports: SELECT cols|* FROM table [[INNER|LEFT] JOIN table2 ON a.col = b.col]
//           [WHERE cond] [ORDER BY col [ASC|DESC]] [LIMIT n]
// cond: comparisons (= != <> > >= < <=), LIKE '%x%', IN (a,b,c), IS [NOT] NULL,
//       combined with AND / OR (AND binds tighter), parens for grouping, NOT prefix.

(function (global) {
  'use strict';

  // ---------- Tokenizer ----------
  const TOKEN_RE = /\s*(=>|<>|>=|<=|!=|[(),=<>*]|'(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*"|[A-Za-z_][A-Za-z0-9_.]*|-?\d+\.\d+|-?\d+)\s*/y;

  function tokenize(sql) {
    const tokens = [];
    let i = 0;
    TOKEN_RE.lastIndex = 0;
    while (i < sql.length) {
      TOKEN_RE.lastIndex = i;
      const m = TOKEN_RE.exec(sql);
      if (!m || m[0].length === 0) {
        if (/\s/.test(sql[i])) { i++; continue; }
        throw new SqlError(`Beklenmeyen karakter: "${sql[i]}" (konum ${i})`);
      }
      tokens.push(m[1]);
      i += m[0].length;
    }
    return tokens;
  }

  class SqlError extends Error {}

  // ---------- Parser ----------
  // Produces an AST: { type:'select', columns:[{expr, alias}], from:{table, alias},
  //   join: {kind, table, alias, on:{left,right}} | null, where: <expr>|null,
  //   orderBy: {col, dir} | null, limit: n | null }

  function parse(sql) {
    const raw = tokenize(sql);
    let pos = 0;
    const peek = () => raw[pos];
    const peekUpper = () => (raw[pos] || '').toUpperCase();
    const next = () => raw[pos++];
    const expectUpper = (word) => {
      if (peekUpper() !== word) throw new SqlError(`"${word}" bekleniyordu, "${peek() ?? '(sorgu sonu)'}" bulundu`);
      return next();
    };
    const isString = (t) => t && ((t[0] === "'" && t[t.length - 1] === "'") || (t[0] === '"' && t[t.length - 1] === '"'));
    const unquote = (t) => t.slice(1, -1).replace(/\\(.)/g, '$1');
    const isNumber = (t) => t && /^-?\d+(\.\d+)?$/.test(t);
    const isIdent = (t) => t && /^[A-Za-z_][A-Za-z0-9_.]*$/.test(t);

    if (peekUpper() !== 'SELECT') throw new SqlError('Sorgu SELECT ile başlamalı');
    next();

    // columns
    const columns = [];
    if (peek() === '*') { next(); columns.push({ star: true }); }
    else {
      while (true) {
        const t = next();
        if (!isIdent(t)) throw new SqlError(`Sütun adı bekleniyordu: "${t}"`);
        let alias = null;
        if (peekUpper() === 'AS') { next(); alias = next(); }
        columns.push({ expr: t, alias });

    let fromAlias = fromTable;
    if (peekUpper() === 'AS') { next(); fromAlias = next(); }

      fromAlias = next();

    let join = null;
    let joinKind = null;
    if (peekUpper() === 'INNER' || peekUpper() === 'LEFT') {
      joinKind = peekUpper() === 'LEFT' ? 'LEFT' : 'INNER';
      next();
      expectUpper('JOIN');
    } else if (peekUpper() === 'JOIN') {
      joinKind = 'INNER';
      next();

    if (joinKind) {
      const jt = next();
      if (!isIdent(jt)) throw new SqlError('JOIN için tablo adı bekleniyordu');
      let ja = jt;
      if (peekUpper() === 'AS') { next(); ja = next(); }
      else if (isIdent(peek()) && peekUpper() !== 'ON') { ja = next(); }

      expectUpper2eq();

    }

    if (peekUpper() === 'WHERE') {

      next();

      if (!isNumber(n)) throw new SqlError('LIMIT sayısal olmalı');
      limit = parseInt(n, 10);

    }
    function parseAnd() {
      let left = parseNot();
      while (peekUpper() === 'AND') { next(); left = { op: 'AND', left, right: parseNot() }; }

    }

        const val = next();
        if (!isString(val)) throw new SqlError('LIKE bir metin bekler');

      }
      if (opUpper === 'IN') {
        next();

        next();
        const vals = [];
        while (true) {

          vals.push(literal(v));

          break;

        if (peek() !== ')') throw new SqlError('IN listesi ")" ile kapanmalı');
        next();

      const opTok = peek();
      if (!cmpOps.includes(opTok)) throw new SqlError(`Karşılaştırma operatörü bekleniyordu, bulunan: "${opTok}"`);

      if (Object.prototype.hasOwnProperty.call(row, rest)) return coerce(row[rest]);

      case 'OR': return !!(evalExpr(node.left, row) || evalExpr(node.right, row));

          case '!=': return a !== b;

    }

    if (ast.orderBy) {
      const { col, dir } = ast.orderBy;

    });

    const dot = expr.indexOf('.');

/* ---------- utils ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtDate(iso){
  if(!iso) return '—';
  const parts = String(iso).split('-');
  if(parts.length!==3) return iso;
  return `${parts[2]}.${parts[1]}.${parts[0]}`;
}
function todayIso(){ return new Date().toISOString().slice(0,10); }
function nextCode(list, field, prefix){
  let max = 0;
  list.forEach(it=>{
    const m = String(it[field]||'').match(new RegExp('^'+prefix+'-(\\d+)$'));
    if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return prefix + '-' + String(max+1).padStart(3,'0');
}
function byId(list,id){ return list.find(x=>x.id===id); }
function projectLabel(p){ return p ? `${p.code} — ${p.name}` : '—'; }

/* ---------- toast ---------- */
function toast(msg, isError){
  const stack = document.getElementById('toastStack');
  const el = document.createElement('div');
  el.className = 'toast' + (isError?' error':'');

/* ---------- db layer ---------- */
let dbCap = null;
let downloadsCap = null;

async function boot(){
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      dbCap = await window.claude.use('db');
      downloadsCap = await window.claude.use('downloads');
    }
  }catch(e){ /* no-op, degrade below */ }

  state.hasDownloads = !!downloadsCap;

  if(dbCap){
    state.dbReady = true;
    try{
      const snap = await dbCap.collection('projects').limit(1).get();
      if(snap.empty){ await seedDatabase(); }
    }catch(e){ console.warn('BA HUB: tohum verisi kontrolü başarısız', e); }
    subscribeAll();
  } else {
    state.dbReady = false;
    loadLocalSeed();
  }
  wireGlobalUi();
  renderAll();
}

async function seedDatabase(){
  for(const coll of COLLECTIONS){
    const items = SEED_DATA[coll] || [];
    for(const item of items){
      const rest = Object.assign({}, item);
      const id = rest.id; delete rest.id;
      try{ await dbCap.collection(coll).doc(id).set(rest); }
      catch(e){ console.warn('BA HUB: tohum kaydı başarısız', coll, id, e); }
    }
  }
}

function loadLocalSeed(){
  COLLECTIONS.forEach(coll=>{ state[coll] = (SEED_DATA[coll]||[]).map(x=>Object.assign({}, x)); });
}

function subscribeAll(){
  COLLECTIONS.forEach(coll=>{
    dbCap.collection(coll).onSnapshot(
      snap=>{ state[coll] = snap.docs.map(d=>Object.assign({id:d.id}, d.data())); renderAll(); },
      err=>{ console.warn('BA HUB: senkronizasyon hatası', coll, err); }
    );
  });
}

async function createDoc(coll, data){
  if(dbCap){
    try{ await dbCap.collection(coll).add(data); toast('Kaydedildi.'); }
    catch(e){ toast('Kaydetme başarısız: ' + (e && e.message ? e.message : e), true); }
  } else {
    state[coll].push(Object.assign({id:uid(coll.slice(0,3))}, data));
    toast('Kaydedildi (yerel oturum — kalıcı depolama bağlı değil).');
    renderAll();
  }
}
async function updateDoc(coll, id, data){
  if(dbCap){
    try{ await dbCap.collection(coll).doc(id).update(data); toast('Güncellendi.'); }
    catch(e){ toast('Güncelleme başarısız: ' + (e && e.message ? e.message : e), true); }
  } else {
    const idx = state[coll].findIndex(x=>x.id===id);
    if(idx>=0) state[coll][idx] = Object.assign({}, state[coll][idx], data);
    toast('Güncellendi (yerel oturum).');
    renderAll();
  }
}
async function deleteDocById(coll, id){
  if(dbCap){
    try{ await dbCap.collection(coll).doc(id).delete(); toast('Silindi.'); }
    catch(e){ toast('Silme başarısız: ' + (e && e.message ? e.message : e), true); }
  } else {
    state[coll] = state[coll].filter(x=>x.id!==id);
    toast('Silindi (yerel oturum).');
    renderAll();
  }
}
function confirmAndDelete(coll, id, label){
  if(confirm(`${label} silinsin mi? Bu işlem geri alınamaz.`)) deleteDocById(coll, id);
}

/* ---------- derived data / traceability ---------- */
function computeTraceability(){
  const rows = state.requirements.map(r=>{
    const stories = state.userStories.filter(u=>u.requirementId===r.id);
    const storyIds = stories.map(s=>s.id);
    const acList = state.acceptanceCriteria.filter(ac=>storyIds.includes(ac.userStoryId));
    const uatList = state.uatCases.filter(u=>storyIds.includes(u.userStoryId));
    const crList = state.changeRequests.filter(c=>(c.relatedRequirementIds||[]).includes(r.id));
    const hasStory = stories.length>0;
    const hasAC = acList.length>0;
    const hasUAT = uatList.length>0;
    const acVerifiedAll = hasAC && acList.every(a=>a.status==='Doğrulandı');
    const uatPassAll = hasUAT && uatList.every(u=>u.status==='Başarılı');
    let traceStatus = 'Yok';
    if(hasStory && hasAC && hasUAT && uatPassAll) traceStatus = 'Tam';
    else if(hasStory || hasAC || hasUAT) traceStatus = 'Kısmi';
    return {requirement:r, stories, acList, uatList, crList, hasStory, hasAC, hasUAT, acVerifiedAll, uatPassAll, traceStatus};
  });
  const total = rows.length || 1;
  const fullCount = rows.filter(r=>r.traceStatus==='Tam').length;
  const partialCount = rows.filter(r=>r.traceStatus==='Kısmi').length;
  const noneCount = rows.filter(r=>r.traceStatus==='Yok').length;
  return {rows, coveragePct: Math.round(fullCount/total*100), fullCount, partialCount, noneCount};
}

/* ---------- small chart components ---------- */
function barChart(items, opts){
  opts = opts || {};
  const max = opts.max || Math.max(1, ...items.map(i=>i.value));
  const fmt = opts.formatValue || (v=>String(v));
  if(!items.length) return '<div class="empty-state">Gösterilecek veri yok.</div>';
  const rows = items.map(it=>{
    const pct = max ? Math.max(it.value>0?2:0, Math.round((it.value/max)*100)) : 0;
    return `<div class="row"><div class="lbl" title="${esc(it.label)}">${esc(it.label)}</div><div class="track"><div class="fill" style="width:${pct}%;background:${it.color||'var(--accent)'}"></div></div><div class="val tnum">${esc(fmt(it.value))}</div></div>`;
  }).join('');
  return `<div class="barchart">${rows}</div>`;
}
function ring(pct, color){
  const p = Math.max(0, Math.min(100, pct));
  const deg = Math.round(p*3.6);
  return `<div class="ring" role="img" aria-label="Kapsam yüzde ${p}" style="background:conic-gradient(${color} ${deg}deg, var(--surface-2) 0)"><b class="tnum">%${p}</b></div>`;
}

function fNumber(name,label,value,opts){
  opts = opts||{};
  return `<div class="field"><label class="field-label" for="f_${name}">${esc(label)}</label><input class="input" type="number" id="f_${name}" name="${name}" value="${esc(value==null?0:value)}" min="${opts.min==null?0:opts.min}" ${opts.step?`step="${opts.step}"`:''}></div>`;
}

/* ---------- modal ---------- */
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function openModal(cfg){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal" style="${cfg.wide?'max-width:720px':''}">
        <div class="modal-head"><div class="modal-title">${esc(cfg.title)}</div><button type="button" class="icon-btn" onclick="closeModal()" aria-label="Kapat">${ICON_CLOSE}</button></div>
        <form id="modalForm" novalidate>
          <div class="modal-body">${cfg.bodyHtml}</div>
          <div class="modal-foot">
            <button type="button" class="btn btn-ghost" onclick="closeModal()">Vazgeç</button>
            <button type="submit" class="btn btn-primary">${esc(cfg.submitLabel||'Kaydet')}</button>
          </div>
        </form>
      </div>
    </div>`;
  document.getElementById('modalBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='modalBackdrop') closeModal(); });
  document.getElementById('modalForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    if(!e.target.reportValidity()) return;
    const fd = new FormData(e.target);
    await cfg.onSubmit(fd);
  });
  const firstInput = root.querySelector('input,select,textarea');
  if(firstInput) firstInput.focus();
}

/* ---------- process flow step editor (inline) ---------- */
function startFlowStepEdit(id){
  const f = byId(state.processFlows, id);
  state.flowEditing = id;
  state.flowStepsDraft = JSON.parse(JSON.stringify(f.steps||[]));
  renderAll();
}
function cancelFlowStepEdit(){ state.flowEditing = null; state.flowStepsDraft = null; renderAll(); }
function addFlowStep(){ state.flowStepsDraft.push({id:uid('s'), type:'process', label:'', branch:''}); renderAll(); }
function removeFlowStep(idx){ state.flowStepsDraft.splice(idx,1); renderAll(); }
function moveFlowStep(idx,dir){
  const j = idx+dir;
  if(j<0||j>=state.flowStepsDraft.length) return;
  const tmp = state.flowStepsDraft[idx];
  state.flowStepsDraft[idx] = state.flowStepsDraft[j];
  state.flowStepsDraft[j] = tmp;
  renderAll();
}
function setFlowStepField(idx, field, value){
  state.flowStepsDraft[idx][field] = value;
  if(field !== 'label') renderAll();
}
async function saveFlowSteps(){
  const id = state.flowEditing;
  const steps = state.flowStepsDraft;
  state.flowEditing = null; state.flowStepsDraft = null;
  await updateDoc('processFlows', id, {steps});
}

/* renders an ordered step list as a vertical flow diagram, grouping
   consecutive branch-tagged steps (branch:'Evet'/'Hayır') into side-by-side
   columns that reconverge at the next non-branch step. */
function renderFlowSteps(steps){
  if(!steps || !steps.length) return emptyState('Bu süreç için henüz adım tanımlanmadı.');
  const flowNode = (s)=>`<div class="flow-node ${s.type}">${esc(s.label||'(isimsiz adım)')}</div>`;
  let html = '<div class="flow">';
  let i = 0;
  while(i < steps.length){
    html += flowNode(steps[i]);
    let j = i+1;
    const branchSteps = [];
    while(j < steps.length && steps[j].branch){ branchSteps.push(steps[j]); j++; }
    if(branchSteps.length){
      html += '<div class="flow-connector arrow"></div>';
      const buckets = {}; const order = [];
      branchSteps.forEach(s=>{ if(!buckets[s.branch]){buckets[s.branch]=[]; order.push(s.branch);} buckets[s.branch].push(s); });
      order.sort((a,b)=> (a==='Evet'?0:a==='Hayır'?1:2) - (b==='Evet'?0:b==='Hayır'?1:2));
      html += '<div class="flow-branch-wrap">';
      order.forEach(label=>{
        html += `<div class="flow-branch"><div class="flow-branch-label">${esc(label)}</div>`;
        buckets[label].forEach((s,idx)=>{
          html += flowNode(s);
          if(idx < buckets[label].length-1) html += '<div class="flow-connector arrow"></div>';
        });
        html += '</div>';
      });
      html += '</div>';
      i = j;
      if(i < steps.length) html += '<div class="flow-connector arrow"></div>';
      continue;
    }
    i++;
    if(i < steps.length) html += '<div class="flow-connector arrow"></div>';
  }
  html += '</div>';
  return html;
}

/* ---------- shared table fragments ---------- */
function crTableHtml(list, opts){
  opts = opts || {};
  const head = `<th>Kod</th><th>Başlık</th>${opts.showProject?'<th>Proje</th>':''}<th>Etki</th><th>Durum</th><th>Tarih</th>${opts.actions?'<th></th>':''}`;
  const rows = list.map(c=>{
    const proj = byId(state.projects, c.projectId);
    return `<tr>
      <td class="cell-strong tnum">${esc(c.crCode)}</td>
      <td>${esc(c.title)}</td>
      ${opts.showProject?`<td class="cell-muted">${proj?esc(proj.code):'—'}</td>`:''}
      <td>${badge(c.impact, crImpactCls(c.impact))}</td>
      <td>${badge(c.status, crStatusCls(c.status))}</td>
      <td class="cell-muted tnum">${fmtDate(c.dateSubmitted)}</td>
      ${opts.actions?`<td><div class="row-actions"><button class="icon-btn" onclick="openChangeRequestModal('${c.id}')" title="Düzenle">${ICON_EDIT}</button><button class="icon-btn" onclick="confirmAndDelete('changeRequests','${c.id}','Değişiklik talebi')" title="Sil">${ICON_TRASH}</button></div></td>`:''}
    </tr>`;
  }).join('');
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function projectStatusBadgeCls(s){ return s==='Aktif'?'badge-accent':s==='Tamamlandı'?'badge-good':s==='Beklemede'?'badge-warning':'badge-neutral'; }
function projectsSummaryHtml(){
  const rows = state.projects.map(p=>{
    const reqCount = state.requirements.filter(r=>r.projectId===p.id).length;
    return `<tr>
      <td class="cell-strong tnum">${esc(p.code)}</td>

function csvEscape(v){ v=String(v==null?'':v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
async function downloadCsv(csv, filename){
  if(downloadsCap){
    try{ await downloadsCap.save({filename, data: csv}); toast('İndirme hazırlandı.'); }
    catch(e){ if(!(e && e.code==='declined')) toast('İndirme başarısız: '+(e&&e.message||e), true); }
  } else {
    toast('İndirme özelliği bu görünümde kullanılamıyor.', true);
  }
}
function exportTraceabilityCsv(){
  const trace = computeTraceability();
  const rows = trace.rows.filter(x=> state.projectFilter==='all' || x.requirement.projectId===state.projectFilter);
  const header = ['Gereksinim Kodu','Başlık','Hikaye Sayısı','Doğrulanmış Kriter','Toplam Kriter','Başarılı UAT','Toplam UAT','CR Sayısı','İzlenebilirlik'];
  const lines = [header.join(',')];
  rows.forEach(x=>{
    const r = x.requirement;
    lines.push([r.reqCode, csvEscape(r.title), x.stories.length, x.acList.filter(a=>a.status==='Doğrulandı').length, x.acList.length, x.uatList.filter(u=>u.status==='Başarılı').length, x.uatList.length, x.crList.length, x.traceStatus].join(','));
  });
  downloadCsv(lines.join('\n'), 'izlenebilirlik_matrisi.csv');
}

function buildSqlTables(){
  return {
    projects: state.projects.map(p=>({id:p.id, code:p.code, name:p.name, client:p.client, status:p.status, priority:p.priority, methodology:p.methodology, phase:p.phase, startDate:p.startDate, endDate:p.endDate})),
    requirements: state.requirements.map(r=>({id:r.id, reqCode:r.reqCode, projectId:r.projectId, title:r.title, type:r.type, priority:r.priority, status:r.status, owner:r.owner, createdDate:r.createdDate})),
    userStories: state.userStories.map(u=>({id:u.id, storyCode:u.storyCode, requirementId:u.requirementId, projectId:u.projectId, epic:u.epic, priority:u.priority, points:u.points, status:u.status})),
    acceptanceCriteria: state.acceptanceCriteria.map(a=>({id:a.id, acCode:a.acCode, userStoryId:a.userStoryId, projectId:a.projectId, status:a.status})),
    changeRequests: state.changeRequests.map(c=>({id:c.id, crCode:c.crCode, projectId:c.projectId, title:c.title, requestedBy:c.requestedBy, impact:c.impact, status:c.status, dateSubmitted:c.dateSubmitted})),
    uatCases: state.uatCases.map(u=>({id:u.id, tcCode:u.tcCode, userStoryId:u.userStoryId, projectId:u.projectId, title:u.title, status:u.status, testedBy:u.testedBy, testedDate:u.testedDate})),
  };
}
function viewSql(){
  setTopbar('SQL / Data', 'ERP tarzı ilişkisel sorgu konsolu', '');
  const tables = buildSqlTables();
  const schemaHtml = Object.keys(tables).map(t=>{
    const cols = tables[t].length ? Object.keys(tables[t][0]) : [];
    return `<div class="schema-table"><div class="schema-table-head">${t}</div><div class="schema-cols">${cols.map(c=>`<span class="schema-col">${esc(c)}</span>`).join('')}</div></div>`;
  }).join('');
  const chips = SQL_EXAMPLES.map((ex,i)=>`<button type="button" class="chip" onclick="runSqlExample(${i})">${esc(ex.label)}</button>`).join('');
  let resultHtml = '';
  if(state.sqlError){
    resultHtml = `<div class="sql-error">${esc(state.sqlError)}</div>`;
  } else if(state.sqlResult){
    const {columns, rows} = state.sqlResult;
    const thead = columns.map(c=>`<th>${esc(c)}</th>`).join('');
    const tbody = rows.map(r=>`<tr>${columns.map(c=>`<td class="tnum">${esc(r[c]==null?'—':r[c])}</td>`).join('')}</tr>`).join('');
    resultHtml = `
      <div class="sql-result-meta"><span>${rows.length} satır</span><span>${state.sqlElapsed} ms</span><button type="button" class="link-btn" onclick="exportSqlCsv()">CSV indir</button></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr>${thead}</tr></thead><tbody>${tbody || `<tr><td colspan="${columns.length||1}" class="empty-state">Sonuç yok.</td></tr>`}</tbody></table></div>`;
  }
  return `
    <div class="card">
      <div class="card-title">Sorgu Konsolu</div>
      <div class="card-sub">SELECT ... FROM ... [JOIN ... ON ...] [WHERE ...] [ORDER BY ...] [LIMIT ...] destekler.</div>
      <div class="toolbar" style="margin-bottom:10px">${chips}</div>
      <textarea class="input sql-editor w-full" id="sqlEditor" spellcheck="false" oninput="state.sqlQuery=this.value" onkeydown="if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){runSqlQuery();}">${esc(state.sqlQuery)}</textarea>
      <div class="toolbar" style="margin-top:10px"><button type="button" class="btn btn-primary" onclick="runSqlQuery()">Çalıştır</button><span class="hint mb-0">Ctrl / ⌘ + Enter</span></div>
      ${resultHtml}
    </div>
    <div class="card">
      <div class="card-title">Veri Sözlüğü</div>
      <div class="card-sub">Sorgulanabilir tablolar ve alanlar</div>
      <div class="schema-list">${schemaHtml}</div>
    </div>`;
}
function runSqlExample(idx){ state.sqlQuery = SQL_EXAMPLES[idx].sql; runSqlQuery(); }
function runSqlQuery(){
  // state.sqlQuery is kept in sync with the textarea on every keystroke via
  // its oninput handler, so it is always the source of truth here — reading
  // the live DOM value too would let a stale rendered textarea (e.g. right
  // after an example-chip click swaps state.sqlQuery before a re-render)
  // silently win over the query we actually mean to run.
  const q = state.sqlQuery;
  const t0 = performance.now();
  try{
    state.sqlResult = window.MiniSQL.run(q, buildSqlTables());
    state.sqlError = null;
  }catch(e){
    state.sqlResult = null;
    state.sqlError = (e && e.message) ? e.message : String(e);
  }
  state.sqlElapsed = Math.max(0, Math.round((performance.now()-t0)*10)/10);
  renderAll();
}
function exportSqlCsv(){
  if(!state.sqlResult) return;
  const {columns, rows} = state.sqlResult;
  const lines = [columns.map(csvEscape).join(',')];
  rows.forEach(r=> lines.push(columns.map(c=>csvEscape(r[c])).join(',')));
  downloadCsv(lines.join('\n'), 'sorgu_sonucu.csv');
}

        <div class="ring-wrap">${ring(tracePct,'var(--good)')}<div style="font-size:12.5px;color:var(--text-2)"><b class="tnum" style="color:var(--good)">${traceFull}</b> / ${traceRows.length} gereksinim uçtan uca izlenebilir.</div></div>

  const reqActive = ROUTES[state.route] && ROUTES[state.route].group==='req';
  return `
    <div class="brand"><div class="brand-mark">BA</div><div class="brand-text"><b>BA · HUB</b><span>İş Analizi Merkezi</span></div></div>
    <div class="nav-group">
      ${navItem('dashboard','Dashboard', NAV_ICONS.dashboard)}
      ${navItem('projects','Projeler', NAV_ICONS.projects)}
      <button type="button" class="nav-item ${reqActive?'active':''}" onclick="toggleReqNav()">
        <span class="ico">${NAV_ICONS.requirements}</span><span>Gereksinimler</span>
        <span class="nav-chevron ${state.reqNavOpen?'open':''}">▸</span>
      </button>
      ${state.reqNavOpen ? `<div class="nav-sub">${REQ_SUB_ROUTES.map(r=>navItem(r, REQ_SUB_LABELS[r], REQ_SUB_ICONS[r])).join('')}</div>` : ''}
      ${navItem('sql','SQL / Data', NAV_ICONS.sql)}
      ${navItem('analytics','Analitik', NAV_ICONS.analytics)}
    </div>
    <div class="sidebar-foot">
      <div><span class="db-dot ${state.dbReady?'':'off'}"></span>${state.dbReady?'Kalıcı depolama bağlı':'Yerel oturum (kalıcı değil)'}</div>
      <div>BA HUB · Özgen Fincan</div>
    </div>`;
}
const VIEW_FNS = {
  dashboard: viewDashboard, projects: viewProjects, 'req-list': viewReqList,
  'user-stories': viewUserStories, 'acceptance-criteria': viewAcceptanceCriteria,
  'process-flow': viewProcessFlow, 'change-requests': viewChangeRequests,
  uat: viewUat, traceability: viewTraceability, sql: viewSql, analytics: viewAnalytics,
};
function render(){
  const fn = VIEW_FNS[state.route] || viewDashboard;
  document.getElementById('mainContent').innerHTML = fn();
}
function renderAll(){
  document.getElementById('sidebar').innerHTML = renderSidebar();
  render();
}
function wireGlobalUi(){
  document.getElementById('hamburgerBtn').addEventListener('click', ()=> document.body.classList.toggle('nav-open'));
  document.addEventListener('click', (e)=>{
    if(!document.body.classList.contains('nav-open')) return;
    if(e.target.closest('#sidebar') || e.target.closest('#hamburgerBtn')) return;
    document.body.classList.remove('nav-open');
  });
  document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });
}

boot();
</script>
